version: "3.9"

services:
  auth:
    build: ./auth
    container_name: auth_service
    ports:
      - "8000:8000"

  products:
    build: ./products
    container_name: products_service
    ports:
      - "8001:8001"

  orders:
    build: ./orders
    container_name: orders_service
    ports:
      - "8002:8002"
    depends_on:
      - auth
      - products
